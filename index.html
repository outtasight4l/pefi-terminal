<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PeFi Terminal</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- TradingView -->
  <script src="https://s3.tradingview.com/tv.js"></script>

  <style>
    body {
      margin: 0;
      background: #0A0A0A;
      color: white;
      font-family: Arial;
    }

    .container {
      padding: 15px;
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #00F0FF;
      font-size: 22px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    p {
      font-size: 14px;
      margin: 5px 0;
    }

    #tv_chart {
      width: 100% !important;
      height: 300px !important;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">

    const { useState, useEffect } = React;

    function Chart() {
      useEffect(() => {
        new TradingView.widget({
          container_id: "tv_chart",
          symbol: "BINANCE:BTCUSDT",
          interval: "15",
          theme: "dark",
          width: "100%",
          height: 300
        });
      }, []);

      return <div id="tv_chart"></div>;
    }

    function App() {
      const [data, setData] = useState({});

      useEffect(() => {
        const interval = setInterval(() => {
          setData({
            bestTrade: {
              symbol: "SOL",
              confidence: Math.floor(Math.random() * 30) + 60
            },
            narrative: "PeFi detects bullish momentum forming with strong probability continuation.",
            heatmap: [
              { symbol: "BTC", confidence: 65 },
              { symbol: "ETH", confidence: 58 },
              { symbol: "SOL", confidence: 82 }
            ]
          });
        }, 2000);

        return () => clearInterval(interval);
      }, []);

      return (
        <div className="container">

          <h1>🧠 PeFi Terminal</h1>

          <Chart />

          <div className="card">
            <h2>🏆 Best Trade</h2>
            <p>{data?.bestTrade?.symbol}</p>
            <p>{data?.bestTrade?.confidence}%</p>
          </div>

          <div className="card">
            <h2>🧠 AI Narrative</h2>
            <p>{data?.narrative}</p>
          </div>

          <div className="card">
            <h2>🌡️ Heatmap</h2>
            {data?.heatmap?.map((h, i) => (
              <p key={i}>{h.symbol} — {h.confidence}%</p>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
